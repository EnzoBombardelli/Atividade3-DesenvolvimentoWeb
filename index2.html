<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Sacola - LabyrinKx.BR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style2.css">
</head>
<body>

    <a href="index.html" class="cart-overlay"></a>

    <div class="cart-drawer">
        
        <div class="cart-header">
            <h2>Minha Sacola</h2>
            <a href="index.html" class="close-btn"><i class="fa-solid fa-xmark"></i></a>
        </div>

        <div class="cart-items">
            <div class="cart-item">
                <button class="remove-btn"><i class="fa-solid fa-xmark"></i></button>
                <img src="https://placehold.co/100x100/e2e8f0/1e293b?text=Dunk+Marrom" alt="Tênis">
                <div class="item-info">
                    <h3>Tênis Nike Dunk Sb Low Pro Marrom</h3>
                    <p>TAMANHO: <span>39</span></p>
                    <div class="item-prices">
                        <span class="old-price">R$ 999,90</span>
                        <span class="new-price">R$ 599,94</span>
                    </div>
                </div>
                <div class="quantity-control">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </div>

            <div class="cart-item">
                <button class="remove-btn"><i class="fa-solid fa-xmark"></i></button>
                <img src="https://placehold.co/100x100/e2e8f0/1e293b?text=Jordan+1+Preto" alt="Tênis">
                <div class="item-info">
                    <h3>Tênis Nike Air Jordan 1 Low Preto</h3>
                    <p>TAMANHO: <span>45</span></p>
                    <div class="item-prices">
                        <span class="new-price">R$ 1.099,90</span>
                    </div>
                </div>
                <div class="quantity-control">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </div>

            <div class="cart-item">
                <button class="remove-btn"><i class="fa-solid fa-xmark"></i></button>
                <img src="https://placehold.co/100x100/e2e8f0/1e293b?text=AF1+Bege" alt="Tênis">
                <div class="item-info">
                    <h3>Tenis Nike Air Force 1 07 Bege</h3>
                    <p>TAMANHO: <span>38</span></p>
                    <div class="item-prices">
                        <span class="new-price">R$ 999,90</span>
                    </div>
                </div>
                <div class="quantity-control">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </div>
        </div>

        <div class="cart-footer">
            <div class="divider"></div>
            
            <p class="free-shipping">Parabéns, você ganhou <span>FRETE GRÁTIS!</span></p>
            
            <div class="shipping-calc">
                <label>Calcule o Frete:</label>
                <div class="input-wrapper">
                    <input type="text" placeholder="00000-000">
                    <button><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="total-row">
                <span class="total-label">Total a pagar:</span>
                <span class="total-value">R$ 2.699,74</span>
            </div>

            <button class="checkout-btn">Finalizar Compra</button>
        </div>
    </div>
</body>
</html>
