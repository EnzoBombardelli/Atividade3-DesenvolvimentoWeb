<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho - LabyrinKx.BR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style2.css">
    <style>
        body {
            background: transparent;
        }

        .cart-background {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .cart-overlay {
            background: rgba(0, 0, 0, 0.82);
            animation: aparecer-overlay 0.25s ease;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            box-shadow: -8px 0 28px rgba(0, 0, 0, 0.18);
            animation: entrar-carrinho 0.3s ease;
        }

        .headerCarrinho {
            min-height: 64px;
            padding: 18px 20px;
        }

        .headerCarrinho h2 {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .BotaoFechar {
            width: 32px;
            height: 32px;
            border-radius: 0;
            background: transparent;
            color: var(--text-dark);
            font-size: 20px;
        }

        .BotaoFechar:hover {
            background: transparent;
            color: #777;
        }

        .ItensCarrinho {
            padding: 20px;
            gap: 0;
        }

        .ItemCarrinho {
            gap: 12px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            border-radius: 0;
            background: transparent;
        }

        .BotaoRemover {
            position: absolute;
            top: 16px;
            right: 0;
            padding: 4px;
        }

        .ItemCarrinho img {
            flex: 0 0 86px;
            width: 86px;
            height: 96px;
            border: 0;
            border-radius: 0;
            object-fit: contain;
        }

        .InformacoesItem {
            padding-right: 22px;
        }

        .InformacoesItem h3 {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.45;
        }

        .InformacoesItem p {
            margin: 6px 0;
        }

        .PrecosItem {
            flex-wrap: wrap;
        }

        .Quantidade {
            position: static;
            align-self: flex-end;
            flex: 0 0 auto;
            margin-left: auto;
            border-radius: 0;
        }

        .Quantidade button {
            min-width: 30px;
            min-height: 30px;
        }

        .footerCarrinho {
            padding: 18px 20px 22px;
        }

        .FreteGratis {
            margin-bottom: 16px;
            text-align: left;
        }

        .LinhaTotal {
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .FraseTotal {
            color: var(--text-dark);
            font-size: 14px;
        }

        .NumeroTotal {
            font-size: 18px;
        }

        .BotaoFinalizarCompra {
            border-radius: 0;
            background: #000;
            box-shadow: none;
        }

        .BotaoFinalizarCompra:hover {
            background: #292929;
        }

        @keyframes entrar-carrinho {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        @keyframes aparecer-overlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 480px) {
            .ItensCarrinho {
                padding: 12px 16px;
            }

            .footerCarrinho {
                padding: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .cart-overlay,
            .cart-drawer {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <!-- Mostra a loja ao fundo do painel. -->
    <iframe class="cart-background" src="index.html" title="Loja" aria-hidden="true" tabindex="-1"></iframe>
    <a href="index.html" class="cart-overlay" aria-label="Fechar sacola"></a>

    <section class="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="titulo-carrinho">
        
        <div class="headerCarrinho">
            <h2 id="titulo-carrinho">Minha sacola (<span class="ContagemItens">3</span>)</h2>
            <a href="index.html" class="BotaoFechar" aria-label="Fechar sacola"><i class="fa-solid fa-xmark"></i></a>
        </div>

        <div class="ItensCarrinho">
            <div class="ItemCarrinho">
                <button class="BotaoRemover" aria-label="Remover Tênis Nike Dunk Sb Low Pro Marrom"><i class="fa-solid fa-xmark"></i></button>
                <img src="img/nike-dunk-white-black.webp" alt="Tênis Nike Dunk">
                <div class="InformacoesItem">
                    <h3>Tênis Nike Dunk Sb Low Pro Marrom</h3>
                    <p>TAMANHO: <span>39</span></p>
                    <div class="PrecosItem">
                        <span class="PrecoAntigo">R$ 999,90</span>
                        <span class="PrecoNovo">R$ 599,94</span>
                    </div>
                </div>
                <div class="Quantidade">
                    <button type="button" aria-label="Diminuir quantidade">-</button>
                    <span>1</span>
                    <button type="button" aria-label="Aumentar quantidade">+</button>
                </div>
            </div>

            <div class="ItemCarrinho">
                <button class="BotaoRemover" aria-label="Remover Tênis Nike Air Jordan 1 Low Preto"><i class="fa-solid fa-xmark"></i></button>
                <img src="img/jordan-1-low-travis-scott-fragment.webp" alt="Tênis Nike Air Jordan 1 Low">
                <div class="InformacoesItem">
                    <h3>Tênis Nike Air Jordan 1 Low Preto</h3>
                    <p>TAMANHO: <span>45</span></p>
                    <div class="PrecosItem">
                        <span class="PrecoNovo">R$ 1.099,90</span>
                    </div>
                </div>
                <div class="Quantidade">
                    <button type="button" aria-label="Diminuir quantidade">-</button>
                    <span>1</span>
                    <button type="button" aria-label="Aumentar quantidade">+</button>
                </div>
            </div>

            <div class="ItemCarrinho">
                <button class="BotaoRemover" aria-label="Remover Tenis Nike Air Force 1 07 Bege"><i class="fa-solid fa-xmark"></i></button>
                <img src="img/adidas-samba.avif" alt="Tênis bege">
                <div class="InformacoesItem">
                    <h3>Tenis Nike Air Force 1 07 Bege</h3>
                    <p>TAMANHO: <span>38</span></p>
                    <div class="PrecosItem">
                        <span class="PrecoNovo">R$ 999,90</span>
                    </div>
                </div>
                <div class="Quantidade">
                    <button type="button" aria-label="Diminuir quantidade">-</button>
                    <span>1</span>
                    <button type="button" aria-label="Aumentar quantidade">+</button>
                </div>
            </div>
        </div>

        <div class="footerCarrinho">
            <p class="FreteGratis">Parabéns, você ganhou <span>FRETE GRÁTIS!</span></p>

            <div class="LinhaTotal">
                <span class="FraseTotal">Subtotal</span>
                <span class="NumeroTotal">R$ 2.699,74</span>
            </div>

            <button class="BotaoFinalizarCompra" type="button">Finalizar compra</button>
        </div>
    </section>

</body>
</html>
