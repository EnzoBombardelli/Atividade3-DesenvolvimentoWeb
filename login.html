<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LabyrinKx.BR</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="HeaderMainFooter headerConteudo">
            <div class="Logo">
                <a href="index.html">LabyrinKx<span>.BR</span></a>
            </div>

            <nav class="BotoesNav">
                <a href="#">Tênis</a>
                <a href="#">Roupas</a>
                <a href="#">Acessórios</a>
                <a href="#" class="Sale">Sale</a>
            </nav>

            <div class="headerIcones">
                <button class="BotoesIcones"><i class="fa-solid fa-magnifying-glass"></i></button>
                <a href="login.html" class="BotoesIcones"><i class="fa-regular fa-user"></i></a>
                <a href="carrinho.html" class="BotaoCarrinho">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="QuantidadeCarrinho">3</span>
                </a>
            </div>
        </div>
    </header>

    <main class="contentor-principal">
        <div class="cabecalho-texto">
            <h2>Acesse sua conta</h2>
            <p>Preencha seus dados de login para acessar sua central do cliente</p>
        </div>

        <div class="cartao-login">
            <form>
                <div class="grupo-input">
                    <input type="text" placeholder="E-mail, CPF ou CNPJ" required>
                </div>
                <div class="grupo-input">
                    <input type="password" placeholder="Senha" required>
                </div>
                
                <div class="recuperar-senha">
                    Esqueceu sua senha? <a href="#">Recuperar</a>
                </div>

                <button type="submit" class="btn-primario">ENTRAR</button>
            </form>
        </div>

        <div class="separador">
            <span>ou</span>
        </div>

        <div class="accoes-secundarias">
            <button class="btn-secundario escuro">
                PRIMEIRO ACESSO? <span>CADASTRE-SE</span>
            </button>
            <button class="btn-secundario claro">
                COMPROU E NÃO POSSUI SENHA? <span>CADASTRE-SE</span>
            </button>
        </div>
    </main>

    <footer class="rodape">

    </footer>
